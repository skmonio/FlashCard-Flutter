<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - Taal Trek</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            color: #007AFF;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .success {
            background: #E8F5E8;
            color: #2E7D32;
            border: 1px solid #4CAF50;
        }
        .error {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #F44336;
        }
        .loading {
            background: #E3F2FD;
            color: #1976D2;
            border: 1px solid #2196F3;
        }
        .button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
        .button:hover {
            background: #0056CC;
        }
        .button.secondary {
            background: #F2F2F7;
            color: #007AFF;
        }
        .button.secondary:hover {
            background: #E5E5EA;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎓</div>
        <h1>Taal Trek</h1>
        <p class="subtitle">Your Dutch Learning Companion</p>
        
        <div id="status" class="status loading">
            Verifying your email...
        </div>
        
        <div id="actions" style="display: none;">
            <a href="#" id="openApp" class="button">Open Taal Trek App</a>
            <a href="#" id="downloadApp" class="button secondary">Download App</a>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const type = urlParams.get('type');
        
        const statusDiv = document.getElementById('status');
        const actionsDiv = document.getElementById('actions');
        const openAppLink = document.getElementById('openApp');
        const downloadAppLink = document.getElementById('downloadApp');
        
        // Check if we're on mobile
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (token && type) {
            // Verify the email using Supabase API
            verifyEmailWithSupabase(token, type);
        } else {
            statusDiv.className = 'status error';
            statusDiv.textContent = '❌ Invalid verification link';
        }
        
        async function verifyEmailWithSupabase(token, type) {
            try {
                // Call Supabase verification endpoint
                const response = await fetch('https://ohrkqrovgsshtoqhwoun.supabase.co/auth/v1/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocmtxcm92Z3NzaHRvcWh3b3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1NzM3NTUsImV4cCI6MjA3MzE0OTc1NX0.sTsLi6I81al0mVxxvr7kzWHtzBgWxL5NTvfciwFc0gM'
                    },
                    body: JSON.stringify({
                        token: token,
                        type: type
                    })
                });
                
                if (response.ok) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ Email verified successfully!';
                    actionsDiv.style.display = 'block';
                    
                    // Set up app links
                    if (isMobile) {
                        openAppLink.href = 'taaltrek://verify-email/?token=' + token + '&type=' + type;
                        openAppLink.textContent = 'Open Taal Trek App';
                    } else {
                        openAppLink.href = 'taaltrek://verify-email/?token=' + token + '&type=' + type;
                        openAppLink.textContent = 'Open Taal Trek App (if installed)';
                    }
                    
                    downloadAppLink.href = 'https://apps.apple.com/app/taal-trek/id123456789'; // Replace with actual App Store link
                    downloadAppLink.textContent = 'Download from App Store';
                } else {
                    const error = await response.json();
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ Verification failed: ' + (error.msg || 'Unknown error');
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Verification failed: ' + error.message;
            }
        }
        
        // Handle app link click
        openAppLink.addEventListener('click', function(e) {
            e.preventDefault();
            
            // Try to open the app
            window.location.href = this.href;
            
            // If app doesn't open within 3 seconds, show download option
            setTimeout(() => {
                if (document.hasFocus()) {
                    alert('Taal Trek app not found. Please download it from the App Store.');
                    downloadAppLink.click();
                }
            }, 3000);
        });
    </script>
</body>
</html>
