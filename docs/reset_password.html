<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Taal Trek</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fb; margin:0; padding:20px; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border-radius:16px; box-shadow:0 20px 40px rgba(0,0,0,0.08); padding:28px; width:100%; max-width:420px; }
    h1 { color:#0a66ff; margin:0 0 6px; font-size:24px; }
    p.sub { color:#666; margin:0 0 18px; }
    .status { padding:12px; border-radius:10px; margin:12px 0; font-size:14px; }
    .loading { background:#e8f0ff; color:#0a54d1; border:1px solid #0a66ff33; }
    .error { background:#ffebee; color:#c62828; border:1px solid #f44336; }
    .success { background:#e8f5e9; color:#2e7d32; border:1px solid #4caf50; }
    label { display:block; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:12px 14px; border:1px solid #d9dbe0; border-radius:10px; font-size:16px; }
    button { width:100%; padding:14px; border:none; border-radius:12px; background:#0a66ff; color:#fff; font-weight:600; font-size:16px; margin-top:16px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .row { display:flex; gap:10px; margin-top:10px; }
    .link { display:inline-block; text-align:center; padding:12px 14px; border-radius:10px; text-decoration:none; border:1px solid #d9dbe0; color:#0a66ff; flex:1; }
    .debug { margin-top:10px; font-size:12px; color:#555; background:#fafafa; border:1px dashed #ddd; padding:10px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">Enter a new password to complete your request.</p>

    <div id="status" class="status loading">Preparing reset...</div>

    <form id="form" style="display:none;">
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8" required />
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required />
      <button id="submitBtn" type="submit">Update Password</button>
    </form>

    <div class="row" id="actions" style="display:none;">
      <a id="openApp" class="link" href="#">Open Taal Trek</a>
      <a id="resend" class="link" href="#">Resend Email</a>
    </div>

    <div id="debug" class="debug" style="display:none;"></div>
  </div>

  <script>
    const PROJECT_URL = 'https://ohrkqrovgsshtoqhwoun.supabase.co';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocmtxcm92Z3NzaHRvcWh3b3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1NzM3NTUsImV4cCI6MjA3MzE0OTc1NX0.sTsLi6I81al0mVxxvr7kzWHtzBgWxL5NTvfciwFc0gM';

    const statusDiv = document.getElementById('status');
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submitBtn');
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');
    const openApp = document.getElementById('openApp');
    const resend = document.getElementById('resend');
    const actions = document.getElementById('actions');
    const debug = document.getElementById('debug');

    // Helpers
    const qs = new URLSearchParams(window.location.search);
    const frag = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    function dbg(obj){ debug.style.display='block'; debug.textContent = JSON.stringify(obj, null, 2); }

    // Collect possible tokens from query or fragment
    let token = qs.get('token') || qs.get('token_hash') || frag.get('access_token') || frag.get('token') || frag.get('token_hash');
    let type = qs.get('type') || frag.get('type') || 'recovery';

    async function exchangeTokenIfNeeded(){
      // If we already have an access token (from fragment), return it
      if (frag.get('access_token')) return frag.get('access_token');

      if (!token) return null;
      // Exchange token for access token via verify endpoint
      const res = await fetch(`${PROJECT_URL}/auth/v1/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': API_KEY },
        body: JSON.stringify({ token, type })
      });
      if (!res.ok) throw new Error('Link invalid or expired');
      const data = await res.json();
      // Supabase returns access_token for recovery
      return data.access_token || null;
    }

    let accessToken = null;

    (async function init(){
      try {
        accessToken = await exchangeTokenIfNeeded();
        if (!accessToken) {
          statusDiv.className = 'status error';
          statusDiv.textContent = 'We could not validate your reset link. Request a new email and try again.';
          actions.style.display = 'flex';
          return;
        }
        statusDiv.className = 'status success';
        statusDiv.textContent = 'Link verified. You can set a new password.';
        form.style.display = 'block';
        actions.style.display = 'flex';
        openApp.href = 'taaltrek://reset-password/';
        resend.href = '#';
        dbg({ query:Object.fromEntries(qs), fragment:Object.fromEntries(frag), type, tokenPresent: !!token, accessTokenPresent: !!accessToken });
      } catch (e) {
        statusDiv.className = 'status error';
        statusDiv.textContent = 'Link invalid or expired. Please request a new reset email.';
        dbg({ error: String(e) });
        actions.style.display = 'flex';
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (pw1.value.length < 8) { alert('Password must be at least 8 characters.'); return; }
      if (pw1.value !== pw2.value) { alert('Passwords do not match.'); return; }
      submitBtn.disabled = true;
      statusDiv.className = 'status loading';
      statusDiv.textContent = 'Updating password...';
      try {
        const res = await fetch(`${PROJECT_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': API_KEY,
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({ password: pw1.value })
        });
        if (!res.ok) throw new Error('Update failed');
        statusDiv.className = 'status success';
        statusDiv.textContent = 'Password updated. You can now open the app and sign in.';
      } catch (e) {
        statusDiv.className = 'status error';
        statusDiv.textContent = 'Failed to update password. Request a new email and try again.';
        dbg({ updateError: String(e) });
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
