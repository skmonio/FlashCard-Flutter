<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - Taal Trek</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #007AFF;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .success {
            background: #E8F5E8;
            color: #2E7D32;
            border: 1px solid #4CAF50;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
        .button:hover {
            background: #0056CC;
        }
        .button.secondary {
            background: #F2F2F7;
            color: #007AFF;
        }
        .button.secondary:hover {
            background: #E5E5EA;
        }
        .info {
            background: #F0F8FF;
            color: #1976D2;
            border: 1px solid #2196F3;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Email Verified!</h1>
        <p class="subtitle">Your Taal Trek account is ready</p>
        
        <div class="success">
            🎉 Your email has been successfully verified!<br>
            You can now sign in to the Taal Trek app.
        </div>
        
        <div class="info">
            <strong>Next Steps:</strong><br>
            1. Open the Taal Trek app on your device<br>
            2. Sign in with your email and password<br>
            3. Start learning Dutch! 🇳🇱
        </div>
        
        <div>
            <a href="taaltrek://open" class="button">Open Taal Trek App</a>
            <a href="https://apps.apple.com/app/taal-trek/id123456789" class="button secondary">Download App</a>
        </div>
    </div>

    <script>
        // Simple redirect to app after 3 seconds
        setTimeout(() => {
            window.location.href = 'taaltrek://open';
        }, 3000);
    </script>
</body>
</html>
